<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="140" viewBox="0 0 240 140">
<defs>
  <filter id="hull" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.4" diffuseConstant="1.22" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="54"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".95" specularExponent="30" lighting-color="#f4f9ff" result="specular"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".5" specularExponent="14" lighting-color="#7fc4ff" result="rim"><feDistantLight azimuth="30" elevation="24"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="rim" operator="arithmetic" k2="1" k3=".55" result="gloss0"/>
    <feComposite in="gloss0" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".42" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".07 .12" numOctaves="3" seed="41" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="9" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".75" k3=".25"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .06  0 0 0 0 .05  0 0 0 0 .05  -1.7 0 0 0 1.02"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
    <feOffset dx="2.5" dy="4.5" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.3" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#77797a"/><stop offset=".42" stop-color="#52565b"/><stop offset="1" stop-color="#252a31"/></linearGradient>
  <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5a6064"/><stop offset=".5" stop-color="#393e44"/><stop offset="1" stop-color="#1c2129"/></linearGradient>
  <linearGradient id="facetL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#838687"/><stop offset="1" stop-color="#41484f"/></linearGradient>
  <linearGradient id="facetR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#454b52"/><stop offset="1" stop-color="#1a2027"/></linearGradient>
  <linearGradient id="spine" x1="0" x2="1"><stop stop-color="#171a20"/><stop offset=".3" stop-color="#727277"/><stop offset=".54" stop-color="#34383e"/><stop offset="1" stop-color="#12161c"/></linearGradient>
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a5c"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#3fd0d8"/></linearGradient>
  <radialGradient id="eye" cx=".4" cy=".35" r=".7"><stop stop-color="#ffe3d6"/><stop offset=".2" stop-color="#ff5a3d"/><stop offset=".6" stop-color="#7a1410"/><stop offset="1" stop-color="#1e0605"/></radialGradient>
  <g id="airframe"><path d="M120 135 97 109 72 103 51 94 33 100 7 88 5 31 16 24 43 32 85 24 98 29 99 15 112 8 128 8 141 15 142 29 155 24 197 32 224 24 235 31 233 88 207 100 189 94 168 103 143 109Z"/></g>
  <g id="drone"><path d="M0 13-3 8-5 4-16-3-17-11-12-12-3-6-2-13H2l1 7 9-6 5 1-1 8L5 4 3 8Z" fill="#575d63" stroke="#11161b" stroke-width=".7"/><path d="M-16-10-12-10-3-5-4 1-14-4Z" fill="#81878a"/><path d="M16-10 12-10 3-5 4 1 14-4Z" fill="#30383f"/><path d="M0 12-2 5-2-11H2L2 5Z" fill="#181e25"/><path d="M-15-12v2 M15-12v2" stroke="#ff7a45" stroke-width="2"/><path d="M0 5 2.5 7v3L0 12l-2.5-2V7Z" fill="#11171d"/><path d="M0 7 1.4 8v2L0 11l-1.4-1V8Z" fill="#ff6749"/><path d="M-5 4-3 8 M5 4 3 8" stroke="#9da6a8" stroke-width=".5"/></g>
  <g id="bay"><path d="M0 0 43-3 47 3 45 20 2 22Z" fill="#182027" stroke="#303740" stroke-width="1.2"/><path d="M2 4 40 2 42 16 4 18Z" fill="#080f14"/><path d="M4 4 40 2 40 5 5 7Z" fill="#69523e" opacity=".65"/><path d="M4 18 42 16v2L4 20Z" fill="#684932"/><path d="M7 5 10 5 11 17H8Z M34 3h3l2 12-3 1Z" fill="#303d42"/><path d="M11 17 34 15 M12 7 34 5" stroke="#bd8050" stroke-width=".6"/><path d="M5 9v5 M41 6v5" stroke="#e29750" stroke-width="1.5"/><path d="M1 3 42 0" stroke="#9ea6a6" stroke-width=".45" opacity=".5"/></g>
