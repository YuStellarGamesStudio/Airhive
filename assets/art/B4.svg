<path d="M120 8 136 31 141 44 99 44 104 31Z" fill="url(#spine)" filter="url(#hull)"/>
<path d="M109 26 116 17 119 25 115 37h-11Z M131 26l-7-9-3 8 4 12h11Z" fill="#0b151c" stroke="#526567" stroke-width=".75"/>
