<path d="M93 42 99 45l-5 17-6-3Z M147 42l-6 3 5 17 6-3Z" fill="#131f27" stroke="#5c6e72" stroke-width=".8"/><path d="M93 47l-2 8 M147 47l2 8" stroke="#74c5cb" stroke-width=".7"/>
