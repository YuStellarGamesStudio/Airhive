<path d="M58 46 73 50 M55 49l19 5 M182 46l-15 4 M185 49l-19 5" stroke="#466871" stroke-width="1.1"/>
<path d="M60 48l13 4 M180 48l-13 4" stroke="#7eced1" stroke-width=".85" opacity=".75"/>
<path d="M56 43l3 2 M181 45l3-2" stroke="#a8bdba" stroke-width=".5" opacity=".48"/>
<path d="M68 60l13 7-2 4-14-7Z M172 60l-13 7 2 4 14-7Z" fill="#101e26" stroke="#374c53" stroke-width=".65"/>
<path d="M69 62l11 6 M171 62l-11 6" stroke="#72bec4" stroke-width=".7" opacity=".55"/>
<path d="M18 27 47 37 45 42 20 34Z M222 27l-29 10 2 5 25-8Z M40 79l30 6-2 6-23-3Z M200 79l-30 6 2 6 23-3Z" fill="#121a22" stroke="#465660" stroke-width=".8"/>
<!-- Five individually shielded burst outlets are recessed below the wing chine. -->
<path d="M51 77 67 80l5 11-17-4Z M77 85l13 4 5 11-15-7Z M189 77l-16 3-5 11 17-4Z M163 85l-13 4-5 11 15-7Z" fill="#0a141d" stroke="#425b61" stroke-width=".7"/>
<path d="M56 80l10 2 M81 88l9 3 M184 80l-10 2 M159 88l-9 3" stroke="#9de0dc" stroke-width="1.1" opacity=".74"/>
<path d="M63 85l2 11 M86 91l4 12 M177 85l-2 11 M154 91l-4 12" stroke="#263841" stroke-width="2.7"/><path d="M63 96h4 M88 103h4 M173 96h4 M148 103h4" stroke="#0a141a" stroke-width="2"/>
<path d="M56 84l10 3 M82 91l8 4 M184 84l-10 3 M158 91l-8 4" stroke="#32454b" stroke-width="1.1"/>
<path d="M48 90l10 4 4-2 M192 90l-10 4-4-2 M77 94l9 5 M163 94l-9 5" stroke="#0b161e" fill="none" stroke-width="1.2"/>
