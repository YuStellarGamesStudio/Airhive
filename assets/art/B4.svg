<path d="M104 77 120 87 136 77 130 97 120 107 110 97Z" fill="#182730" stroke="#496269" stroke-width=".7"/>
<path d="M104 79 120 89 136 79 M110 99l10 8 10-8 M120 109v23" fill="none" stroke="#0b151d" stroke-width="1.1"/>
