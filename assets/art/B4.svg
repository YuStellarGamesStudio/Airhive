<path d="M9 28 76 46 105 48 120 62 102 79 79 71 42 61Z M231 28 164 46 135 48 120 62 138 79 161 71 198 61Z" fill="url(#film)" opacity=".09"/>
<path d="M5 27 13 22 77 42 103 38 M235 27 227 22 163 42 137 38 M15 74l28 18 25 1 12 8 M225 74l-28 18-25 1-12 8" fill="none" stroke="#101820" stroke-width="2.6"/>
