<path d="M101 58h3v9h-3Z M136 58h3v9h-3Z M109 108h4v3h-4Z M127 108h4v3h-4Z" fill="#0a1821" stroke="#4b6469" stroke-width=".5"/>
<path d="M116 116h8l-4 15Z" fill="#0b1820"/><path d="M118 119h4" stroke="#94cfcd" stroke-width=".65"/>
<!-- Covert flush emissive strips, discontinuous so they never read as a cartoon outline. -->
<g stroke="#77c8ce" fill="none" stroke-linecap="round" filter="url(#glow)"><path d="M26 30 36 33 M204 33l10-3 M59 40l9 3 M181 40l-9 3" stroke-width=".9" opacity=".65"/><path d="M53 90l9 2 M187 90l-9 2 M97 56l-2 7 M143 56l2 7" stroke-width=".9" opacity=".7"/></g>
<path d="M73 48 79 51l-3 4-7-3Z M167 48l-6 3 3 4 7-3Z" fill="#241e24"/><path d="M72 50l4 2 M168 50l-4 2" stroke="#bc564b" stroke-width=".8" opacity=".75"/>
<use href="#airframe" xlink:href="#airframe" filter="url(#wear)" opacity=".3"/>
</svg>
