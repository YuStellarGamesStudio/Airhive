<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="100" viewBox="0 0 120 100">
<defs>
  <filter id="hull" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.4" diffuseConstant="1.22" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="54"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".95" specularExponent="30" lighting-color="#f4f9ff" result="specular"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".5" specularExponent="14" lighting-color="#7fc4ff" result="rim"><feDistantLight azimuth="30" elevation="24"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="rim" operator="arithmetic" k2="1" k3=".55" result="gloss0"/>
    <feComposite in="gloss0" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".42" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".07 .12" numOctaves="3" seed="33" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="13" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".75" k3=".25"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .06  0 0 0 0 .05  0 0 0 0 .05  -1.7 0 0 0 1.02"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
    <feOffset dx="2.5" dy="4.5" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.3" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="wingL" x1="1" y1="1" x2="0" y2="0"><stop stop-color="#626770"/><stop offset=".55" stop-color="#494f58"/><stop offset="1" stop-color="#353a42"/></linearGradient>
  <linearGradient id="wingR" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#4a4e56"/><stop offset=".55" stop-color="#363b43"/><stop offset="1" stop-color="#272a31"/></linearGradient>
  <linearGradient id="facetL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#818890"/><stop offset="1" stop-color="#595e67"/></linearGradient>
  <linearGradient id="facetR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#393d46"/><stop offset="1" stop-color="#242830"/></linearGradient>
  <linearGradient id="pod" x1="0" x2="1"><stop stop-color="#191e25"/><stop offset=".3" stop-color="#78818a"/><stop offset=".55" stop-color="#414952"/><stop offset="1" stop-color="#141a20"/></linearGradient>
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a5c"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#3fd0d8"/></linearGradient>
  <radialGradient id="eye" cx=".4" cy=".35" r=".7"><stop stop-color="#ffe3d6"/><stop offset=".2" stop-color="#ff5a3d"/><stop offset=".6" stop-color="#7a1410"/><stop offset="1" stop-color="#1e0605"/></radialGradient>
  <g id="airframe"><path d="M52 9h16l-2 24 49-14 1 9-46 38-1 22-9 10-9-10-1-22L4 28l1-9 49 14Z M44 61h7l-2 36h-4Z M69 61h7l-1 36h-4Z"/></g>
  <g id="glyph"><path d="M0-4 3.5-2v4L0 4l-3.5-2v-4Z" fill="#501b1b"/><path d="M0-2 2 2h-4Z" fill="#ff6653"/></g>
</defs>
<use href="#airframe" xlink:href="#airframe" filter="url(#shadow)"/>
<!-- Forward-swept razor wedges and long needle fuselage distinguish this fast interceptor. -->
<g filter="url(#hull)"><path d="M53 33 5 19 4 28 50 66 57 55Z" fill="url(#wingL)"/><path d="M67 33 115 19 116 28 70 66 63 55Z" fill="url(#wingR)"/><path d="M52 10h16l-1 20H53Z" fill="url(#pod)"/></g>
<path d="M53 33 5 19 4 28 50 66 57 55Z M67 33 115 19 116 28 70 66 63 55Z" fill="url(#film)" opacity=".1"/>
<path d="M6 20 52 34 54 43 8 24Z M114 20 68 34 66 43 112 24Z" fill="url(#facetL)" opacity=".67"/>
<path d="M7 27 49 58 51 63 37 55Z M113 27 71 58 69 63 83 55Z" fill="#22272d"/>
<path d="M6 20 51 34 M114 20 69 34 M18 27 48 50 M102 27 72 50" fill="none" stroke="#a4afb6" stroke-width=".7" opacity=".6"/>
<path d="M8 25 51 58 M112 25 69 58" fill="none" stroke="#b22b35" stroke-width="1.25" opacity=".85"/>
<path d="M22 29 26 39 M98 29 94 39 M34 33 39 50 M86 33 81 50" fill="none" stroke="#181d23" stroke-width=".65"/>
<use href="#glyph" xlink:href="#glyph" transform="translate(38 38) scale(.85)"/><use href="#glyph" xlink:href="#glyph" transform="translate(82 38) scale(.85)"/>
<!-- Twin flush booster slots and graphite intake lips. -->
<path d="M53 10h14l-1-6H54Z" fill="#171b22"/><path d="M55 6h10" stroke="#ff7a45" stroke-width="2.5" filter="url(#glow)"/><path d="M56 5.4h8" stroke="#ffe8da" stroke-width=".55"/>
<path d="M51 47 43 43 45 62 51 68Z M69 47 77 43 75 62 69 68Z" fill="url(#pod)" filter="url(#hull)"/>
<path d="M46 48 49 50l1 9-4-2Z M74 48 71 50l-1 9 4-2Z" fill="#10171e" stroke="#929da4" stroke-width=".55"/>
<!-- Narrow ceramic fuselage has separate lit and shadow facets. -->
<path d="M60 98 52 88 50 65 53 32 54 9h12l1 23 3 33-2 23Z" fill="url(#facetR)" filter="url(#hull)"/>
<path d="M60 98 52 88 50 65 53 32 54 9h6Z" fill="url(#facetL)"/>
<path d="M60 98 52 88 50 65 53 32 54 9h12l1 23 3 33-2 23Z" fill="url(#film)" opacity=".09"/>
<path d="M60 13 56 24l-1 22 5 6 5-6-1-22Z" fill="#111920"/>
<path d="M60 15 57 26l-1 17 4 6 4-6-1-17Z" fill="#314452"/>
<path d="M57 25 59 18l1-1-1 18Z" fill="#bbcdd6" opacity=".62"/>
<path d="M60 52V94 M53 55l-2 11 3 17 M67 55l2 11-3 17" fill="none" stroke="#141b24" stroke-width=".6"/>
<path d="M58 54v24 M62 54v24" stroke="#c03940" stroke-width=".55" opacity=".8"/>
<path d="M60 96 58 89h4Z" fill="url(#eye)"/><circle cx="60" cy="92" r=".65" fill="#ffd6cc" filter="url(#glow)"/>
<!-- Three-round burst comes from independently faired long gun barrels. -->
<g filter="url(#hull)"><path d="M44 62h8l-1 13-7 1Z M68 62h8v14l-7-1Z" fill="url(#pod)"/></g>
<path d="M46 72h3v23h-3Z M71 72h3v23h-3Z" fill="#20252c" stroke="#747b84" stroke-width=".55"/>
<path d="M47 76v16 M72 76v16" stroke="#b3bec5" stroke-width=".45"/>
<path d="M45 94h5v3h-5Z M70 94h5v3h-5Z" fill="#11151a"/>
<path d="M47 97h2 M71 97h2" stroke="#ed5751" stroke-width="1.2" filter="url(#glow)"/>
<use href="#airframe" xlink:href="#airframe" filter="url(#wear)" opacity=".3"/>
</svg>
