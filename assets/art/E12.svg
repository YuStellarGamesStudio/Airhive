<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="100" viewBox="0 0 120 100">
<defs>
  <filter id="hull" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.4" diffuseConstant="1.22" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="54"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".95" specularExponent="30" lighting-color="#f4f9ff" result="specular"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".5" specularExponent="14" lighting-color="#7fc4ff" result="rim"><feDistantLight azimuth="30" elevation="24"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="rim" operator="arithmetic" k2="1" k3=".55" result="gloss0"/>
    <feComposite in="gloss0" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".42" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".07 .12" numOctaves="3" seed="32" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="12" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".75" k3=".25"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .06  0 0 0 0 .05  0 0 0 0 .05  -1.7 0 0 0 1.02"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
    <feOffset dx="2.5" dy="4.5" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.3" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="wingL" x1="1" y1="1" x2="0" y2="0"><stop stop-color="#777573"/><stop offset=".6" stop-color="#57585b"/><stop offset="1" stop-color="#45494e"/></linearGradient>
  <linearGradient id="wingR" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#53565a"/><stop offset=".6" stop-color="#414448"/><stop offset="1" stop-color="#33363a"/></linearGradient>
  <linearGradient id="facetL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#888587"/><stop offset="1" stop-color="#696a6c"/></linearGradient>
  <linearGradient id="facetR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45474c"/><stop offset="1" stop-color="#292d30"/></linearGradient>
  <linearGradient id="pod" x1="0" x2="1"><stop stop-color="#292b2e"/><stop offset=".32" stop-color="#89847c"/><stop offset=".62" stop-color="#4d4d4e"/><stop offset="1" stop-color="#212427"/></linearGradient>
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a5c"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#3fd0d8"/></linearGradient>
  <radialGradient id="mine" cx=".35" cy=".27" r=".72"><stop stop-color="#bca794"/><stop offset=".35" stop-color="#635c55"/><stop offset=".75" stop-color="#32363a"/><stop offset="1" stop-color="#111418"/></radialGradient>
  <g id="airframe"><path d="M51 8H69L74 27 109 24 115 40 113 53 85 63 76 71 69 92 60 97 51 92 44 71 35 63 7 53 5 40 11 24 46 27Z"/></g>
  <g id="payload"><path d="M0-9 2-5 5-8 5-4 9-2 5 1 8 5 3 5 0 9-2 5-6 7-5 2-9-1-5-4-6-8-2-5Z" fill="#88827a" stroke="#22272b" stroke-width=".8"/><circle r="5.6" fill="url(#mine)" stroke="#1c2227" stroke-width=".8"/><path d="M-3-1q1-3 4-3 M-3 1l4 2" fill="none" stroke="#c3b6a7" stroke-width=".7"/><path d="M-1.8-1.4 1.8-1.4 2 1-2 1Z" fill="#261512"/><circle r="1.2" fill="#ff643d"/></g>
  <g id="glyph"><path d="M0-4 3.5-2v4L0 4l-3.5-2v-4Z" fill="#501b1b"/><path d="M0-2 2 2h-4Z" fill="#fa6644"/></g>
</defs>
<use href="#airframe" xlink:href="#airframe" filter="url(#shadow)"/>
<!-- High-mounted armored wing gives a clear view of the three dispensing cradles. -->
<g filter="url(#hull)"><path d="M49 27 11 24 5 40 7 53 35 63 49 56Z" fill="url(#wingL)"/><path d="M71 27 109 24 115 40 113 53 85 63 71 56Z" fill="url(#wingR)"/><path d="M51 8h18l5 24H46Z" fill="url(#pod)"/></g>
<path d="M49 27 11 24 5 40 7 53 35 63 49 56Z M71 27 109 24 115 40 113 53 85 63 71 56Z" fill="url(#film)" opacity=".1"/>
<path d="M11 25 46 29l-2 9L6 39Z M109 25 74 29l2 9 38 1Z" fill="url(#facetL)" opacity=".5"/>
<path d="M8 43 37 47 47 54 35 61 7 51Z M112 43 83 47 73 54 85 61 113 51Z" fill="url(#facetR)" opacity=".8"/>
<path d="M7 41 44 45 M113 41 76 45 M15 27 35 31 M105 27 85 31" stroke="#a7aaad" stroke-width=".65" opacity=".52" fill="none"/>
<path d="M16 34 40 36l-2 5-26-3Z M104 34 80 36l2 5 26-3Z" fill="#25292d" stroke="#7c7770" stroke-width=".6"/>
<path d="M18 35 33 36 M102 35l-15 1" stroke="#c37248" stroke-width="1"/>
<use href="#glyph" xlink:href="#glyph" transform="translate(29 29)"/><use href="#glyph" xlink:href="#glyph" transform="translate(91 29)"/>
<!-- Each exposed mine sits in a recessed fork, not on a painted-on stripe. -->
<g filter="url(#hull)"><path d="M12 49 38 51 38 64 18 62 13 58Z M108 49 82 51 82 64 102 62 107 58Z" fill="url(#pod)"/></g>
<path d="M17 54 35 56l-1 7-15-2Z M103 54 85 56l1 7 15-2Z" fill="#0e1418" stroke="#aaa096" stroke-width=".55"/>
<path d="M17 53 36 55 M103 53 84 55" stroke="#d5a86d" stroke-width=".8"/>
<use href="#payload" xlink:href="#payload" transform="translate(26 59) scale(.83)"/><use href="#payload" xlink:href="#payload" transform="translate(94 59) scale(.83)"/>
<!-- Exhaust slots at the aft edge point away from the player. -->
<path d="M51 10h18l-2-6H53Z" fill="#202327"/><path d="M54 8h12" stroke="#ff7a45" stroke-width="2.4" filter="url(#glow)"/><path d="M55 7h10" stroke="#ffe7d5" stroke-width=".6"/>
<path d="M60 96 51 92 44 69 46 32 52 13H68L74 32 76 69 69 92Z" fill="url(#facetR)" filter="url(#hull)"/>
<path d="M60 96 51 92 44 69 46 32 52 13h8Z" fill="url(#facetL)" opacity=".86"/>
<path d="M60 96 51 92 44 69 46 32 52 13H68L74 32 76 69 69 92Z" fill="url(#film)" opacity=".08"/>
<path d="M53 21h14l3 17-20 1Z" fill="#11191d"/><path d="M54 22h12l2 13-16 1Z" fill="#344651"/><path d="M54 23 59 22l-5 9Z" fill="#bed0d1" opacity=".6"/>
<path d="M47 42 51 48 48 69 56 87 M73 42 69 48 72 69 64 87" fill="none" stroke="#11171b" stroke-width=".9"/>
<path d="M51 46 53 60 M69 46 67 60" stroke="#b5a49a" stroke-width=".55" opacity=".7"/>
<path d="M52 69h16l-2 14-6 5-6-5Z" fill="#161c20" stroke="#a6a29c" stroke-width=".75"/>
<path d="M54 71h12" stroke="#da9a64" stroke-width="1"/>
<use href="#payload" xlink:href="#payload" transform="translate(60 78)"/>
<path d="M55 87 60 94 65 87Z" fill="#2a1817"/><path d="M57 88h6" stroke="#ff643d" stroke-width="1" filter="url(#glow)"/>
<use href="#airframe" xlink:href="#airframe" filter="url(#wear)" opacity=".3"/>
</svg>
