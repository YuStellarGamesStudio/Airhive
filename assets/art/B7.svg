<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="140" viewBox="0 0 240 140">
<defs>
  <filter id="hull" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.4" diffuseConstant="1.22" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="54"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".95" specularExponent="30" lighting-color="#f4f9ff" result="specular"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".5" specularExponent="14" lighting-color="#7fc4ff" result="rim"><feDistantLight azimuth="30" elevation="24"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="rim" operator="arithmetic" k2="1" k3=".55" result="gloss0"/>
    <feComposite in="gloss0" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".42" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".07 .12" numOctaves="3" seed="47" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="9" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".75" k3=".25"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .06  0 0 0 0 .05  0 0 0 0 .05  -1.7 0 0 0 1.02"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
    <feOffset dx="2.5" dy="4.5" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.3" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="plateL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#85898f"/><stop offset=".46" stop-color="#454c56"/><stop offset="1" stop-color="#222936"/></linearGradient>
  <linearGradient id="plateR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#545a63"/><stop offset=".52" stop-color="#303742"/><stop offset="1" stop-color="#151e29"/></linearGradient>
  <linearGradient id="armorL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a2a5a6"/><stop offset=".55" stop-color="#6b707a"/><stop offset="1" stop-color="#3c4550"/></linearGradient>
  <linearGradient id="armorR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#626671"/><stop offset="1" stop-color="#282f3a"/></linearGradient>
  <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#151924"/><stop offset=".32" stop-color="#686a77"/><stop offset=".6" stop-color="#363944"/><stop offset="1" stop-color="#131923"/></linearGradient>
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a5c"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#3fd0d8"/></linearGradient>
  <radialGradient id="reactor" cx=".34" cy=".3"><stop stop-color="#fff1ff"/><stop offset=".25" stop-color="#c398ef"/><stop offset=".62" stop-color="#683895"/><stop offset="1" stop-color="#19192f"/></radialGradient>
  <g id="airframe"><path d="M103 9h34l16 12 41 3 34 15 1 25-17 15-34-3-28 29-12 23-18 11-18-11-12-23-28-29-34 3-17-15 1-25 34-15 41-3Z"/></g>
  <g id="glyph"><path d="M0-5 4-3v6L0 5l-4-2v-6Z" fill="#4e202c"/><path d="m0-2.7 2.5 4h-5Z" fill="#e96566"/></g>
</defs>
<use href="#airframe" xlink:href="#airframe" filter="url(#shadow)"/>
<!-- Wide stern hammerhead and engine blocks; all forward mass converges on a solid ram. -->
<g filter="url(#hull)"><path d="M106 24 46 24 12 39 11 64l17 15 36-6 40 34 24-51Z" fill="url(#plateL)"/><path d="M134 24 194 24l34 15 1 25-17 15-36-6-40 34-24-51Z" fill="url(#plateR)"/><path d="M13 40 50 28 101 29 87 47 45 54 12 56Z M227 40l-37-12-51 1 14 18 42 7 33 2Z" fill="url(#armorL)"/><path d="M33 72 70 59l35 39-21-8-22-16Z M207 72l-37-13-35 39 21-8 22-16Z" fill="url(#armorR)"/></g>
<path d="M18 42 48 32l49-1m125 11-30-10-49-1M14 63l15 12 35-5 27 26m135-33-15 12-35-5-27 26" fill="none" stroke="#0d121a" stroke-width="1.15" opacity=".7"/>
<path d="M14 43 50 29l38 2-13 14-31 9-32 2Z M226 43l-36-14-38 2 13 14 31 9 32 2Z" fill="url(#film)" opacity=".1"/>
<path d="M18 55 42 50l15-10 12-2m153 17-24-5-15-10-12-2" fill="none" stroke="#a5a5ae" stroke-width=".6" opacity=".28"/>
<!-- Heat-resistant tile shingles and recessed thermal vents on the broad shoulders. -->
<path d="M25 44 49 34l12 1-16 13-20 5Zm31-8 17-3-10 11-15 5Zm159 8-24-10-12 1 16 13 20 5Zm-31-8-17-3 10 11 15 5Z" fill="#141c27" opacity=".26"/>
<path d="M20 60 45 55 74 51m146 9-25-5-29-4M38 69l20-6 25 20m119-14-20-6-25 20" fill="none" stroke="#121720" stroke-width="1.1"/>
<path d="M23 60 42 56m175 4-19-4M47 34l19-2m127 2-19-2" stroke="#c5c1c7" stroke-width=".55" opacity=".26"/>
<path d="M26 65h12m165 0h12M46 61l12-4m136 4-12-4" stroke="#1a202a" stroke-width="1.4"/>
<path d="M28 46v5m4-7v5m4-7v5m176-1v5m-4-7v5m-4-7v5" stroke="#1a2028" stroke-width="1.4"/>
<path d="M65 34h13m-14 3h11m-13 3h10m113-6h-13m14 3h-11m13 3h-10" stroke="#191e29" stroke-width="1.5"/>
<!-- Four large stern drives, hot ceramic throat liners and particulate scorches. -->
<path d="M49 25 58 11h17l9 24-12 18-17-7Z M191 25l-9-14h-17l-9 24 12 18 17-7Z" fill="url(#metal)" filter="url(#hull)"/>
<path d="M57 14h19v7H54Zm107 0h19l3 7h-22Z" fill="#111721"/>
<path d="M59 19v9m4-9v9m4-9v9m4-9v9m98-9v9m4-9v9m4-9v9m4-9v9" stroke="#101620" stroke-width="1"/>
<path d="M50 30 80 35m110-5-30 5" stroke="#6a5360" stroke-width="4" opacity=".3"/>
<g filter="url(#glow)"><path d="M57 12h18m90 0h18" stroke="#ff7a45" stroke-width="3"/></g>
<path d="M61 12h10m98 0h10" stroke="#ffe9de" stroke-width=".7"/>
<!-- Aft circular reactor is deeply buried between stern-mounted machinery. -->
<path d="M102 10h36l16 19-5 29-29 16-29-16-5-29Z" fill="url(#metal)" filter="url(#hull)"/>
<path d="M103 13h34l12 18-5 25-24 13-24-13-5-25Z" fill="#2b2b39"/>
<path d="M96 28h48m-49 30 25 13 25-13" stroke="#101720" stroke-width="1.1" fill="none"/>
<path d="M120 26 133 33v15l-13 7-13-7V33Z" fill="#101522" stroke="#585565" stroke-width="1"/>
<circle cx="120" cy="40" r="10" fill="#121424"/>
<circle cx="120" cy="40" r="7" fill="url(#reactor)"/>
<path d="M112 37h-8m24 0h8m-16-7v-7m0 31v-7" stroke="#89909a" stroke-width="2.3"/>
<path d="M111 49h18" stroke="#181c2a" stroke-width="3"/>
<path d="M115 35h4" stroke="#f3d8ff" stroke-width=".7" opacity=".7"/>
<!-- Armored power channels descend on either side of the long solid impact spar. -->
<path d="M96 54 77 69 88 88 102 115 112 118l-8-30 8-29Zm48 0 19 15-11 19-14 27-10 3 8-30-8-29Z" fill="#171a27" stroke="#323342" stroke-width=".7"/>
<path d="M99 55 86 70l14 25 8 17m33-57 13 15-14 25-8 17" stroke="#38294d" stroke-width="5" fill="none"/>
<path d="M101 57 90 71l13 25 7 14m29-53 11 14-13 25-7 14" stroke="#9a6ac0" stroke-width="1.8" opacity=".85" fill="none"/>
<path d="M89 73l8 3m-5 5 8 3m-4 6 8 3m47-20-8 3m5 5-8 3m4 6-8 3" stroke="#535566" stroke-width="1.6"/>
<!-- Battering ram: a continuous reinforced wedge under staggered ceramic scales. -->
<path d="M120 53 147 72 151 91 139 115 120 139 101 115 89 91 93 72Z" fill="url(#metal)" filter="url(#hull)"/>
<path d="M120 57 145 75 145 91 135 112 120 136 105 112 95 91 95 75Z" fill="#242b37"/>
<path d="M96 74 120 61v73l-16-25-10-20Z" fill="url(#armorL)"/>
<path d="M144 74 120 61v73l16-25 10-20Z" fill="url(#armorR)"/>
<path d="M96 75 120 67 144 75 138 84 120 92 102 84Z" fill="url(#plateL)" stroke="#1a1e29" stroke-width="1"/>
<path d="M100 86 120 93 140 86 136 99 120 107 104 99Z" fill="url(#armorL)" stroke="#171b25" stroke-width="1"/>
<path d="M105 102 120 109 135 102 130 115 120 123 110 115Z" fill="url(#plateR)" stroke="#171d28" stroke-width="1"/>
<path d="M111 117 120 124 129 117 125 130 120 138 115 130Z" fill="#252c38" stroke="#141820" stroke-width="1.1"/>
<path d="M102 77 120 72m-15 15 15 7m-12 9 12 8m-8 9 8 7" stroke="#dee2df" stroke-width=".5" opacity=".27" fill="none"/>
<path d="M120 68v63m-19-50 5 2m33-2-5 2m-26 17 5 3m19-3-5 3" stroke="#121622" stroke-width="1.15"/>
<path d="M112 95l8 5 8-5m-13 19 5 4 5-4" stroke="#191a27" stroke-width="1" fill="none"/>
<use href="#glyph" xlink:href="#glyph" transform="translate(40 69) rotate(-16)"/><use href="#glyph" xlink:href="#glyph" transform="translate(200 69) rotate(16)"/>
<path d="M21 63h7m191 0h-7" stroke="#a277ca" stroke-width="1" filter="url(#glow)"/>
<use href="#airframe" xlink:href="#airframe" filter="url(#wear)" opacity=".3"/>
</svg>
