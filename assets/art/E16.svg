<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="100" viewBox="0 0 120 100">
<defs>
  <filter id="hull" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.4" diffuseConstant="1.22" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="54"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".95" specularExponent="30" lighting-color="#f4f9ff" result="specular"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".5" specularExponent="14" lighting-color="#7fc4ff" result="rim"><feDistantLight azimuth="30" elevation="24"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="rim" operator="arithmetic" k2="1" k3=".55" result="gloss0"/>
    <feComposite in="gloss0" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".42" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".07 .12" numOctaves="3" seed="36" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="16" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".75" k3=".25"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .06  0 0 0 0 .05  0 0 0 0 .05  -1.7 0 0 0 1.02"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
    <feOffset dx="2.5" dy="4.5" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.3" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="wingL" x1="1" y1="1" x2="0" y2="0"><stop stop-color="#808281"/><stop offset=".55" stop-color="#5b6263"/><stop offset="1" stop-color="#40474c"/></linearGradient>
  <linearGradient id="wingR" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#555c60"/><stop offset=".55" stop-color="#42494d"/><stop offset="1" stop-color="#2a3037"/></linearGradient>
  <linearGradient id="facetL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#999b99"/><stop offset="1" stop-color="#666c70"/></linearGradient>
  <linearGradient id="facetR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#464a50"/><stop offset="1" stop-color="#292e33"/></linearGradient>
  <linearGradient id="pod" x1="0" x2="1"><stop stop-color="#24282c"/><stop offset=".32" stop-color="#868d8c"/><stop offset=".62" stop-color="#4d5556"/><stop offset="1" stop-color="#1c2228"/></linearGradient>
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a5c"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#3fd0d8"/></linearGradient>
  <radialGradient id="eye" cx=".4" cy=".35" r=".7"><stop stop-color="#ffe3d6"/><stop offset=".2" stop-color="#ff5a3d"/><stop offset=".6" stop-color="#7a1410"/><stop offset="1" stop-color="#1e0605"/></radialGradient>
  <g id="airframe"><path d="M48 7h24l11 18 32 9 1 18-37 28-12 12-7 6-7-6-12-12L4 52l1-18 32-9Z"/></g>
  <!-- Miniature of E1: swept kite wing, dual orange ion pods, dark spine, red hexagonal nose optic. -->
  <g id="drone"><path d="M0 15-2 9-11 3l-1-6 3-1 7 4 1-10h2L2 0l7-4 3 1-1 6-9 6Z" fill="#54595d" stroke="#171c21" stroke-width=".6"/><path d="M-10-2-2 1-2 6-10 2Z" fill="#828489"/><path d="M10-2 2 1 2 6 10 2Z" fill="#353a40"/><path d="M0-7-2 5 0 13 2 5Z" fill="#1d2228"/><path d="M-10-4v-2 M10-4v-2" stroke="#ff7a45" stroke-width="1.5"/><path d="M0 7 2 8v3l-2 1-2-1V8Z" fill="#371b1a"/><path d="M0 8 1 9v1l-1 1-1-1V9Z" fill="#ff674b"/></g>
  <g id="glyph"><path d="M0-4 3.5-2v4L0 4l-3.5-2v-4Z" fill="#501b1b"/><path d="M0-2 2 2h-4Z" fill="#ff7253"/></g>
</defs>
<use href="#airframe" xlink:href="#airframe" filter="url(#shadow)"/>
<!-- Broad, stepped blended wing carries the actual lift and launch machinery. -->
<g filter="url(#hull)"><path d="M48 17 37 25 5 34 4 52 41 80 52 80 57 42Z" fill="url(#wingL)"/><path d="M72 17 83 25 115 34 116 52 79 80 68 80 63 42Z" fill="url(#wingR)"/><path d="M48 9h24l10 19H38Z" fill="url(#pod)"/></g>
<path d="M48 17 37 25 5 34 4 52 41 80 52 80 57 42Z M72 17 83 25 115 34 116 52 79 80 68 80 63 42Z" fill="url(#film)" opacity=".1"/>
<path d="M6 35 38 27 49 20 52 40 9 45Z M114 35 82 27 71 20 68 40 111 45Z" fill="url(#facetL)" opacity=".65"/>
<path d="M6 50 46 49 52 76 41 79Z M114 50 74 49 68 76 79 79Z" fill="url(#facetR)" opacity=".84"/>
<path d="M6 35 37 27 47 19 M114 35 83 27 73 19 M6 51 40 76 M114 51 80 76" fill="none" stroke="#aeb4b6" stroke-width=".75" opacity=".57"/>
<path d="M8 42 35 37l-1 8-28 3Z M112 42 85 37l1 8 28 3Z" fill="#272c31" stroke="#798084" stroke-width=".55"/>
<path d="M11 44 31 40 M109 44l-20-4" stroke="#f2cd68" stroke-width="1.2"/>
<path d="M22 55 39 61l-2-10-13-3Z M98 55 81 61l2-10 13-3Z" fill="url(#pod)" opacity=".7"/>
<use href="#glyph" xlink:href="#glyph" transform="translate(24 36)"/><use href="#glyph" xlink:href="#glyph" transform="translate(96 36)"/>
<!-- Three thrust-vectoring slot engines embedded in the trailing edge. -->
<g filter="url(#hull)"><path d="M28 25 39 22l2 13-13 3Z M81 22l11 3v13l-13-3Z M52 9h16l2 13H50Z" fill="url(#pod)"/></g>
<path d="M29 28 39 25 M81 25l10 3 M53 11h14" stroke="#161d23" stroke-width="3"/>
<path d="M30 27 37 25.5 M83 25.5 90 27 M54 9.5h12" stroke="#ff7a45" stroke-width="2.4" filter="url(#glow)"/>
<path d="M31 26.9 36 26 M84 26l5 .9 M56 9.2h8" stroke="#ffe8d7" stroke-width=".55"/>
<!-- Command blister is forward of the recessed double-width deployment well. -->
<path d="M60 98 53 92 41 77 39 47 44 27 48 9h24l4 18 5 20-2 30-12 15Z" fill="url(#facetR)" filter="url(#hull)"/>
<path d="M60 98 53 92 41 77 39 47 44 27 48 9h12Z" fill="url(#facetL)"/>
<path d="M60 98 53 92 41 77 39 47 44 27 48 9h24l4 18 5 20-2 30-12 15Z" fill="url(#film)" opacity=".09"/>
<path d="M50 22 60 17l10 5 6 18-32 0Z" fill="#121c22"/><path d="M51 23 60 19l9 4 5 15H46Z" fill="#394d55"/><path d="M51 24 60 19l-9 14Z" fill="#bdced0" opacity=".56"/>
<path d="M46 39h28 M49 14h22" stroke="#131a1d" stroke-width=".7"/>
<!-- Dark well, yellow linear catapult tracks and two fully visible E1-shaped docked drones. -->
<path d="M42 43h36l-3 35-15 15-15-15Z" fill="#0d141b" stroke="#9b9d9a" stroke-width="1"/>
<path d="M47 47h26l-3 27-10 12-10-12Z" fill="#181e25"/>
<path d="M51 49v28 M69 49v28" stroke="#e9b34f" stroke-width="1.3"/><path d="M50 49v28 M70 49v28" stroke="#fff0a8" stroke-width=".4"/>
<use href="#drone" xlink:href="#drone" transform="translate(51 63) scale(.86)"/>
<use href="#drone" xlink:href="#drone" transform="translate(69 63) scale(.86)"/>
<path d="M40 47 46 48 47 77 43 82 38 72Z M80 47 74 48 73 77 77 82 82 72Z" fill="url(#pod)" filter="url(#hull)"/>
<path d="M41 51 45 52v22 M79 51l-4 1v22" stroke="#c6cbca" stroke-width=".6" fill="none"/>
<path d="M42 58 45 59 M78 58l-3 1 M43 72l2 4 M77 72l-2 4" stroke="#ffcf68" stroke-width="1.25" filter="url(#glow)"/>
<path d="M52 88 60 96 68 88Z" fill="#252a2e"/><path d="M56 90 60 93 64 90" stroke="#f8c963" stroke-width="1" fill="none"/>
<use href="#airframe" xlink:href="#airframe" filter="url(#wear)" opacity=".3"/>
</svg>
