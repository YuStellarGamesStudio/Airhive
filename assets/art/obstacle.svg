<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="90" viewBox="0 0 100 90">
<defs>
  <filter id="hull" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.4" diffuseConstant="1.18" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="54"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".9" specularExponent="26" lighting-color="#f4f9ff" result="specular"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".4" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".09 .14" numOctaves="3" seed="41" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="2" seed="12" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".75" k3=".25"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .07  0 0 0 0 .05  0 0 0 0 .04  -1.8 0 0 0 1.1"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
    <feOffset dx="2" dy="4" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.1" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- Cylinder shading runs across the module's short axis -->
  <linearGradient id="module" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8e9296"/><stop offset=".22" stop-color="#d6d8d6"/><stop offset=".4" stop-color="#eceae4"/><stop offset=".7" stop-color="#9c9c98"/><stop offset="1" stop-color="#4e5154"/>
  </linearGradient>
  <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6d98a"/><stop offset=".3" stop-color="#b9862f"/><stop offset=".55" stop-color="#e9c46a"/><stop offset=".8" stop-color="#8a5f22"/><stop offset="1" stop-color="#d7ad55"/>
  </linearGradient>
  <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1c1a19"/><stop offset=".5" stop-color="#0b0a0a"/><stop offset="1" stop-color="#231c18"/>
  </linearGradient>
  <linearGradient id="cells" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3a5d8f"/><stop offset=".35" stop-color="#16294a"/><stop offset=".6" stop-color="#274a7a"/><stop offset="1" stop-color="#0c1a30"/>
  </linearGradient>
  <linearGradient id="hatch" x1="0" x2="1">
    <stop offset="0" stop-color="#5a5e62"/><stop offset=".4" stop-color="#b7babb"/><stop offset="1" stop-color="#3d4044"/>
  </linearGradient>
  <pattern id="grid" width="3.2" height="3.2" patternUnits="userSpaceOnUse">
    <path d="M0 0H3.2M0 0V3.2" fill="none" stroke="#9fb6d6" stroke-width=".25" opacity=".55"/>
  </pattern>
  <filter id="drop" x="-10%" y="-10%" width="125%" height="130%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.8"/>
    <feOffset dx="2" dy="3.5" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in" result="shade"/>
    <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<g filter="url(#drop)">

<!-- Shattered photovoltaic wing on a bent boom (upper left) -->
<g transform="rotate(-24 26 22)">
  <path d="M6 14H40V32H22L17 27 12 32H6Z" fill="url(#cells)"/>
  <path d="M6 14H40V32H22L17 27 12 32H6Z" fill="url(#grid)"/>
  <path d="M6 14H40V32H6Z" fill="none" stroke="#5e6468" stroke-width=".9"/>
  <path d="M23 14V32 M6 23H40" stroke="#6b7278" stroke-width=".6"/>
  <path d="M29 18.5 31.5 22.4 30.4 27 M31.5 22.4 36 21" fill="none" stroke="#c9d8ea" stroke-width=".3" opacity=".5"/>
  <path d="M8 16 20 16" stroke="#e8f1ff" stroke-width=".7" opacity=".4"/>
</g>
<path d="M36 22 44 30 51 33" fill="none" stroke="#3b3e42" stroke-width="2.6" stroke-linecap="round"/>
<path d="M36 21.2 44 29.2 51 32.2" fill="none" stroke="#a4a8ab" stroke-width=".7"/>

<!-- Pressurized module section, tumbling -->
<g transform="rotate(-20 50 47)">
  <g filter="url(#hull)">
    <path d="M14 34H66L69 35.2 67.8 37.4 71 38.6 69.4 41 72.6 43.2 70.2 45.6 73 48.4 69.8 50.2 72.2 53.6 68.6 55.4 70.4 58.2 67 60H14Q10 47 14 34Z" fill="url(#module)"/>
    <ellipse cx="14.5" cy="47" rx="4.5" ry="13" fill="url(#hatch)"/>
  </g>
  <path d="M14 34H66L69 35.2 67.8 37.4 71 38.6 69.4 41 72.6 43.2 70.2 45.6 73 48.4 69.8 50.2 72.2 53.6 68.6 55.4 70.4 58.2 67 60H14Q10 47 14 34Z" filter="url(#wear)" opacity=".35"/>
  <!-- Gold multilayer-insulation blankets -->
  <path d="M28 34.6H44V59.4H28Z" fill="url(#foil)" opacity=".92"/>
  <path d="M30 36 33 40 31 45 34 50 31 56 M38 35.5 41 42 38 49 42 57" fill="none" stroke="#6a4412" stroke-width=".4" opacity=".32"/>
  <path d="M29 38 43 37 M29 53 43 52" stroke="#fff3c4" stroke-width=".5" opacity=".55"/>
  <!-- Ring frames and panel seams -->
  <path d="M24 34.4V59.6 M48 34.4V59.6 M58 34.4V59.6 M14 40.5H70 M14 53.5H70" fill="none" stroke="#2b2d30" stroke-width=".55" opacity=".6"/>
  <path d="M24.6 35V59 M48.6 35V59" stroke="#fff" stroke-width=".35" opacity=".4"/>
  <circle cx="14.5" cy="47" r="3.2" fill="#2c2f33"/>
  <circle cx="14.5" cy="47" r="1.8" fill="#15171a"/>
  <path d="M12.6 36.8 16.4 36.8 M12.6 57.2 16.4 57.2" stroke="#e3e6e8" stroke-width=".6" opacity=".6"/>
  <!-- Torn end: exposed interior, ribs, hot rims -->
  <path d="M67.4 36.4 69.6 38.8 68.4 41.6 71 43.6 69 46 71.4 48.6 68.8 50.8 70.8 53.8 67.8 55.8 68.8 58.4 66.2 58.8Q63.6 47 67.4 36.4Z" fill="url(#interior)"/>
  <path d="M67.8 39.4Q66.2 47 67.6 55.4" fill="none" stroke="#5d5752" stroke-width=".6"/>
  <path d="M66 60 67 58.4 M65.4 34 66.6 35.6" stroke="#15171a" stroke-width=".6"/>
  <g fill="none" stroke="#ff9a4d" stroke-linejoin="round" filter="url(#glow)" opacity=".85">
    <path d="M69 35.2 67.8 37.4 71 38.6 69.4 41 72.6 43.2 70.2 45.6 73 48.4 69.8 50.2 72.2 53.6 68.6 55.4 70.4 58.2" stroke-width=".45"/>
  </g>
  <!-- Exposed conduits spilling from the tear -->
  <path d="M72 47Q80 45 84 50 M73 50Q79 54 82 60 M71 42Q78 37 84 38" fill="none" stroke="#2a2c30" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M72 47Q80 45 84 50 M71 42Q78 37 84 38" fill="none" stroke="#c7482d" stroke-width=".5" opacity=".8"/>
  <path d="M73 50Q79 54 82 60" fill="none" stroke="#3aa0c8" stroke-width=".5" opacity=".8"/>
</g>

<!-- Bent truss girder trailing below -->
<g fill="none" stroke-linecap="round">
  <path d="M40 66 58 70 74 80 M42 72 59 75 72 85" stroke="#3a3d41" stroke-width="1.6"/>
  <path d="M40 66 42 72 M46 67.3 47 73.2 43 72.2 M52 68.6 53 74.2 47 73.2 M58 70 59 75 53 74.2 M64 73.7 64 78.3 59 75 M70 77.5 69 81.8 64 78.3" stroke="#56595d" stroke-width=".8"/>
  <path d="M40 65.3 58 69.3 74 79.3" stroke="#b6b9bb" stroke-width=".45" opacity=".6"/>
</g>

<!-- Embers and hot fragments -->
<g filter="url(#glow)">
  <circle cx="90" cy="30" r=".9" fill="#ffb25e"/>
  <circle cx="86" cy="58" r=".7" fill="#ff8a3d"/>
  <circle cx="93" cy="44" r=".55" fill="#ffd28a"/>
  <path d="M80 70 82.5 69 82 71.5Z" fill="#ff7a38"/>
</g>
</g>
</svg>
