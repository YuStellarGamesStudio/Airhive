<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="140" viewBox="0 0 240 140">
<defs>
  <filter id="hull" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.4" diffuseConstant="1.22" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="54"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".95" specularExponent="30" lighting-color="#f4f9ff" result="specular"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".5" specularExponent="14" lighting-color="#7fc4ff" result="rim"><feDistantLight azimuth="30" elevation="24"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="rim" operator="arithmetic" k2="1" k3=".55" result="gloss0"/>
    <feComposite in="gloss0" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".42" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".07 .12" numOctaves="3" seed="43" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="9" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".75" k3=".25"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .06  0 0 0 0 .05  0 0 0 0 .05  -1.7 0 0 0 1.02"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
    <feOffset dx="2.5" dy="4.5" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.3" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#82817b"/><stop offset=".45" stop-color="#565b59"/><stop offset="1" stop-color="#272d30"/></linearGradient>
  <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#656664"/><stop offset=".55" stop-color="#424648"/><stop offset="1" stop-color="#1c232a"/></linearGradient>
  <linearGradient id="facetL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#92918a"/><stop offset="1" stop-color="#4a5355"/></linearGradient>
  <linearGradient id="facetR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#505252"/><stop offset="1" stop-color="#222930"/></linearGradient>
  <linearGradient id="spine" x1="0" x2="1"><stop stop-color="#161b20"/><stop offset=".3" stop-color="#888b85"/><stop offset=".53" stop-color="#535b5a"/><stop offset="1" stop-color="#161c23"/></linearGradient>
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a5c"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#3fd0d8"/></linearGradient>
  <radialGradient id="eye" cx=".38" cy=".32" r=".7"><stop stop-color="#fff6d0"/><stop offset=".2" stop-color="#ffc866"/><stop offset=".58" stop-color="#9a541c"/><stop offset="1" stop-color="#231a13"/></radialGradient>
  <g id="airframe"><path d="M120 136 104 126 92 106 54 113 39 103 20 107 5 91 7 34 22 25 75 29 87 16 104 23 120 13 136 23 153 16 165 29 218 25 233 34 235 91 220 107 201 103 186 113 148 106 136 126Z"/></g>
  <g id="battery"><path d="M-18-10-10-18 10-18 18-10 19 8 10 17-10 17-19 8Z" fill="#141c22" stroke="#4e5a5a" stroke-width="1.4"/><path d="M-16-10-8-15 7-15 15-10 16 6 9 13-9 13-16 6Z" fill="url(#spine)"/><path d="M-16-8-8-14-1-14-5 12-10 13-16 6Z" fill="url(#facetL)" opacity=".65"/><path d="M-12-9H9 M-14 7H13" stroke="#8d9691" stroke-width=".55" opacity=".65"/><path d="M-13 10-6 14 6 14 14 10 13 16 5 20-5 20-13 16Z" fill="#20292d" stroke="#59625f" stroke-width=".6"/><path d="M-10 15h8v16h-8Z M2 15h8v16H2Z" fill="#3b4648" stroke="#111920" stroke-width="1"/><path d="M-8 20h4 M4 20h4 M-8 25h4 M4 25h4" stroke="#171d22" stroke-width="1.5"/><path d="M-10 29h8v6h-8Z M2 29h8v6H2Z" fill="#171d22" stroke="#6f7770" stroke-width=".65"/><path d="M-10 34h8 M2 34h8" stroke="#0c1117" stroke-width="2.8"/><path d="M-8-4h16v7H-8Z" fill="#11191e"/><path d="M-5-1h10" stroke="#e8a752" stroke-width="1.4"/><path d="M-12 3h3 M9 3h3 M-6 17v12 M6 17v12" stroke="#9da7a0" stroke-width=".55" opacity=".6"/></g>
  <pattern id="ram" width="10" height="8" patternUnits="userSpaceOnUse"><path d="M0 2 3 0h4l3 2v4L7 8H3L0 6 M5 0v8" fill="none" stroke="#0b1218" stroke-width=".55" opacity=".65"/></pattern>
</defs>
