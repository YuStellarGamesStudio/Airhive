<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="140" viewBox="0 0 240 140">
<defs>
  <filter id="hull" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.4" diffuseConstant="1.22" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="54"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".95" specularExponent="30" lighting-color="#f4f9ff" result="specular"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".5" specularExponent="14" lighting-color="#7fc4ff" result="rim"><feDistantLight azimuth="30" elevation="24"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="rim" operator="arithmetic" k2="1" k3=".55" result="gloss0"/>
    <feComposite in="gloss0" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".42" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".07 .12" numOctaves="3" seed="41" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="9" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".75" k3=".25"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .06  0 0 0 0 .05  0 0 0 0 .05  -1.7 0 0 0 1.02"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
    <feOffset dx="2.5" dy="4.5" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.3" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#777877"/><stop offset=".48" stop-color="#505459"/><stop offset="1" stop-color="#262c34"/></linearGradient>
  <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#53585d"/><stop offset=".5" stop-color="#393f47"/><stop offset="1" stop-color="#1a242c"/></linearGradient>
  <linearGradient id="facetL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d9990"/><stop offset="1" stop-color="#566068"/></linearGradient>
  <linearGradient id="facetR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4e5359"/><stop offset="1" stop-color="#222831"/></linearGradient>
  <linearGradient id="pod" x1="0" x2="1"><stop stop-color="#22272c"/><stop offset=".25" stop-color="#777e80"/><stop offset=".56" stop-color="#454d53"/><stop offset="1" stop-color="#1a2028"/></linearGradient>
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a5c"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#3fd0d8"/></linearGradient>
  <radialGradient id="seeker" cx=".36" cy=".3"><stop stop-color="#ffe6b9"/><stop offset=".34" stop-color="#fba04e"/><stop offset="1" stop-color="#79391e"/></radialGradient>
  <g id="airframe"><path d="M98 8h44l13 23 52 1 22 15-3 38-28 5-15-5-18 25-25-4-20 29-20-29-25 4-18-25-15 5-28-5-3-38 22-15 52-1Z"/></g>
  <g id="cell"><path d="M-6-18 6-18 7 17-7 17Z" fill="#111820" stroke="#1a222b" stroke-width=".7"/><path d="M-6-17 6-17 6-12-6-12Z" fill="#323f48"/><path d="M-8-11-12-14-12 9-8 13-7 9-7-9Z" fill="#8a9092" stroke="#17212a" stroke-width=".55"/><path d="M8-11 12-14 12 9 8 13 7 9 7-9Z" fill="#303940" stroke="#161e27" stroke-width=".55"/><path d="M-3-7 0-13 3-7 3 11 0 15-3 11Z" fill="url(#pod)"/><path d="M-3 9 0 15 3 9Z" fill="url(#seeker)"/><path d="M-3-7h6m-3 1v14M-10-8v14m20-14v14" stroke="#17202b" stroke-width=".65"/><path d="M-6 17h12" stroke="#e5a273" stroke-width="1"/></g>
  <g id="glyph"><path d="M0-5 4.5-2.5v5L0 5l-4.5-2.5v-5Z" fill="#4b2224"/><path d="m0-2.8 2.7 4.3h-5.4Z" fill="#f37347"/></g>
</defs>
<use href="#airframe" xlink:href="#airframe" filter="url(#shadow)"/>
<!-- Low aspect-ratio missile deck, squared shoulders and cranked aft edges. -->
<g filter="url(#hull)"><path d="M103 33 37 34 12 47 15 83 40 88 57 82 75 108 106 96 117 57Z" fill="url(#wingL)"/><path d="M137 33 203 34 228 47 225 83 200 88 183 82 165 108 134 96 123 57Z" fill="url(#wingR)"/><path d="M15 48 41 37 98 37 87 52 42 60 14 62Z M225 48l-26-11-57 0 11 15 45 8 28 2Z" fill="url(#facetL)"/><path d="M43 82 83 70l22 24-29 10-19-25Z M197 82l-40-12-22 24 29 10 19-25Z" fill="url(#facetR)"/></g>
<path d="M15 47 39 38 99 37 M225 47l-24-9-60-1 M17 81l22 5 19-7 19 25m146-23-22 5-19-7-19 25" stroke="#141b23" stroke-width=".65" fill="none" opacity=".6"/>
<path d="M17 50 47 40 90 39 80 53 46 59 17 58Z M223 50l-30-10-43-1 10 14 34 6 29-1Z" fill="url(#film)" opacity=".1"/>
<path d="M16 62 42 58 84 52 M224 62l-26-4-42-6 M44 86l30-12 17 21m105-9-30-12-17 21" stroke="#181e25" stroke-width="1.3" fill="none"/>
<!-- Composite access panels and shallow sensor/thermal tile banks. -->
<path d="M16 49 40 39l25-1-13 13-18 5-18 1Zm208 0-24-10-25-1 13 13 18 5 18 1Z M42 87l16-7 21 19-12 3Zm156 0-16-7-21 19 12 3Z" fill="#acaaaa" opacity=".14"/>
<path d="M18 57 34 55l8-5 9-1m171 8-16-2-8-5-9-1M49 90l11-6 13 10m118-4-11-6-13 10" stroke="#1b242d" stroke-width="1.25" fill="none"/>
<path d="M19 51 36 43m169 0 16 8" stroke="#bcbcb8" stroke-width=".55" opacity=".28"/>
<path d="M91 50h-6m5 3h-6m-1 3h6m68-6h-6m-1 3h6m1 3h-6" stroke="#111922" stroke-width="1.6"/>
<path d="M19 72v-7m4 7v-7m4 7v-7m194 7v-7m-4 7v-7m-4 7v-7" stroke="#323b42" stroke-width="1.3"/>
<!-- Paired three-cell VLS banks: ready missiles and open blast-resistant hatch petals. -->
<g filter="url(#hull)"><path d="M27 48 91 43 95 92 39 98 21 83Z" fill="url(#pod)"/><path d="M213 48 149 43 145 92 201 98 219 83Z" fill="url(#pod)"/></g>
<path d="M27 50 88 46l4 43-52 5-15-12Z M213 50l-61-4-4 43 52 5 15-12Z" fill="#343d44" stroke="#1b252d" stroke-width=".8"/>
<path d="M28 52 88 48m124 4-60-4M25 80l16 11 50-5m124-6-16 11-50-5" stroke="#18222b" stroke-width=".75" fill="none"/>
<use href="#cell" xlink:href="#cell" transform="translate(42 68) rotate(-5)"/><use href="#cell" xlink:href="#cell" transform="translate(61 66) rotate(-4)"/><use href="#cell" xlink:href="#cell" transform="translate(80 64) rotate(-3)"/>
<use href="#cell" xlink:href="#cell" transform="translate(198 68) rotate(5)"/><use href="#cell" xlink:href="#cell" transform="translate(179 66) rotate(4)"/><use href="#cell" xlink:href="#cell" transform="translate(160 64) rotate(3)"/>
<!-- Thermal shields and blast deflectors beneath the live rounds. -->
<path d="M30 89 42 94l13-3-12-6Zm20-1 13 4 13-4-13-6Zm24-2 9 4 7-3-8-6Zm136 3-12 5-13-3 12-6Zm-20-1-13 4-13-4 13-6Zm-24-2-9 4-7-3 8-6Z" fill="#535d61" stroke="#1b242d" stroke-width=".75"/>
<path d="M31 89 42 93l12-3m-3-2 12 3 12-4m119 2-12 4-12-3m3-2-12 3-12-4" stroke="#aeb7b7" stroke-width=".5" opacity=".28" fill="none"/>
<path d="M30 91 40 96l50-5m120 0-10 5-50-5" fill="none" stroke="#202a32" stroke-width="1.35"/>
<!-- Two removable missile rails under outboard armored tips. -->
<path d="M14 51 19 49 28 50l-3 53-6 12-5-12Z M226 51l-5-2-9 1 3 53 6 12 5-12Z" fill="url(#pod)" stroke="#181d24" stroke-width="1"/>
<path d="M18 59v35m204-35v35" stroke="#a0a7a5" stroke-width=".55" opacity=".28"/>
<path d="m19 114-4-12h8Zm202 0-4-12h8Z" fill="url(#seeker)"/>
<!-- Ion propulsors recessed into the aft armored spar. -->
<g filter="url(#hull)"><path d="M67 32 72 10h19l9 30-14 11-17-5Z M173 32l-5-22h-19l-9 30 14 11 17-5Z" fill="url(#pod)"/></g>
<path d="M72 13h19m58 0h19" stroke="#e0e5dd" stroke-width=".55" opacity=".28"/>
<path d="M72 12h19v5H72Zm77 0h19v5h-19Z" fill="#1a2228"/>
<path d="M75 17v8m4-8v8m4-8v8m4-8v8m66-8v8m4-8v8m4-8v8m4-8v8" stroke="#050e15" stroke-width="1"/>
<g filter="url(#glow)"><path d="M74 11h15m62 0h15" stroke="#ff7a45" stroke-width="3" stroke-linecap="round"/></g>
<path d="M77 11h9m68 0h9" stroke="#ffefdc" stroke-width=".75"/>
<!-- Tactical spine and armored fire-control radome, never another VLS cell. -->
<path d="M98 8h44l14 34-6 51-13 24-17 18-17-18-13-24-6-51Z" fill="url(#pod)" filter="url(#hull)"/>
<path d="M99 10 120 18v110l-17-16-13-25-3-43Z" fill="url(#facetL)" opacity=".85"/>
<path d="M141 10 120 18v110l17-16 13-25 3-43Z" fill="url(#facetR)" opacity=".9"/>
<path d="M101 12h38l11 26-7 8H97l-7-8Z" fill="#303940" stroke="#18232c" stroke-width=".8"/>
<path d="M96 27h48M90 39h60M89 53l3 34 14 26m45-60-3 34-14 26" stroke="#182028" stroke-width="1.1" fill="none"/>
<path d="M97 24h46m-49 30 2 28m50-28-2 28M106 115l14 14 14-14" stroke="#a4adae" stroke-width=".55" opacity=".28" fill="none"/>
<path d="M102 56h36l-5 24-13 17-13-17Z" fill="#1a242e" stroke="#17222b" stroke-width=".8"/>
<path d="M107 59h26l-5 18-8 11-8-11Z" fill="#303f46"/>
<path d="M110 62h20l-10 15Z" fill="#95a3a4" opacity=".7"/>
<path d="M116 96h8l-4 30Z" fill="#192129"/>
<path d="M119 106h2v17h-2Z" fill="#ff9c57" filter="url(#glow)"/>
<path d="M111 37h18m-16 3h14m-12 3h10" stroke="#141c24" stroke-width="1" opacity=".7"/>
<use href="#glyph" xlink:href="#glyph" transform="translate(55 103) rotate(-14)"/><use href="#glyph" xlink:href="#glyph" transform="translate(185 103) rotate(14)"/>
<path d="M31 46h7m171 0h-7 M43 95h8m146 0h-8" stroke="#ff9b57" stroke-width="1.4" filter="url(#glow)"/>
<use href="#airframe" xlink:href="#airframe" filter="url(#wear)" opacity=".3"/>
</svg>
