<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="160" height="120" viewBox="0 0 160 120">
<defs>
  <!-- Shared realistic material kit: light from upper-left (azimuth 225°). -->
  <filter id="bevel" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.6" diffuseConstant="1.18" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="52"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.6" specularConstant=".75" specularExponent="18" lighting-color="#fff4df" result="specular"><feDistantLight azimuth="225" elevation="44"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".38" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="grime" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".055 .11" numOctaves="3" seed="7" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="3" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".7" k3=".3"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .08  0 0 0 0 .1  0 0 0 0 .12  -1.6 0 0 0 1.02"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
    <feOffset dx="2.5" dy="5" result="blur"/>
    <feFlood flood-color="#02070d" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.4" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="paintWingL" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9aa6ae"/><stop offset=".55" stop-color="#87939c"/><stop offset="1" stop-color="#76828b"/>
  </linearGradient>
  <linearGradient id="paintWingR" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#88949d"/><stop offset=".55" stop-color="#7a8690"/><stop offset="1" stop-color="#66727c"/>
  </linearGradient>
  <linearGradient id="fuselage" x1="0" x2="1">
    <stop offset="0" stop-color="#6d7982"/><stop offset=".2" stop-color="#b8c2c7"/><stop offset=".38" stop-color="#d6dde0"/><stop offset=".62" stop-color="#8e9aa2"/><stop offset="1" stop-color="#505c66"/>
  </linearGradient>
  <linearGradient id="nacelle" x1="0" x2="1">
    <stop offset="0" stop-color="#5d6973"/><stop offset=".3" stop-color="#aab5bb"/><stop offset=".55" stop-color="#8a959d"/><stop offset="1" stop-color="#46525c"/>
  </linearGradient>
  <linearGradient id="radome" x1="0" x2="1">
    <stop offset="0" stop-color="#4f5a62"/><stop offset=".35" stop-color="#8d979d"/><stop offset="1" stop-color="#3e4850"/>
  </linearGradient>
  <radialGradient id="canopy" cx=".36" cy=".3" r=".8">
    <stop offset="0" stop-color="#fff6d2"/><stop offset=".12" stop-color="#d9c27a"/><stop offset=".38" stop-color="#7c6b3a"/><stop offset=".7" stop-color="#2d2b22"/><stop offset="1" stop-color="#0d1115"/>
  </radialGradient>
  <radialGradient id="nozzle" cx=".5" cy=".35" r=".6">
    <stop offset="0" stop-color="#1a1411"/><stop offset=".55" stop-color="#3a2b24"/><stop offset=".8" stop-color="#6b5a4d"/><stop offset="1" stop-color="#2a2d31"/>
  </radialGradient>
  <linearGradient id="petals" x1="0" x2="1">
    <stop offset="0" stop-color="#3b3f44"/><stop offset=".3" stop-color="#8a8680"/><stop offset=".5" stop-color="#b19a7e"/><stop offset=".75" stop-color="#6c5f55"/><stop offset="1" stop-color="#2c2f33"/>
  </linearGradient>
  <linearGradient id="missile" x1="0" x2="1">
    <stop offset="0" stop-color="#8a8f92"/><stop offset=".35" stop-color="#eef0ec"/><stop offset="1" stop-color="#7d8285"/>
  </linearGradient>

  <g id="airframe">
    <path d="M58 50 12 82 13 90 57 86Z M102 50 148 82 147 90 103 86Z"/>
    <path d="M57 92 36 104 37 110 58 106Z M103 92 124 104 123 110 102 106Z"/>
    <path d="M57.4 47C56.5 62 56.5 90 57.4 106L58 113.5h14L72.6 106 73 46Z M102.6 47C103.5 62 103.5 90 102.6 106L102 113.5H88L87.4 106 87 46Z"/>
    <path d="M80 3C76.5 9 73 20 71 33L66 46 73 56 74 98 77 106h6l3-8 1-42 7-10-5-13C87 20 83.5 9 80 3Z"/>
  </g>
</defs>

<use href="#airframe" xlink:href="#airframe" filter="url(#shadow)"/>

<!-- Wings, root to tip, with leading-edge and flap articulation -->
<g filter="url(#bevel)">
  <path d="M58 50 12 82 13 90 57 86Z" fill="url(#paintWingL)"/>
  <path d="M102 50 148 82 147 90 103 86Z" fill="url(#paintWingR)"/>
  <path d="M57 92 36 104 37 110 58 106Z" fill="url(#paintWingL)"/>
  <path d="M103 92 124 104 123 110 102 106Z" fill="url(#paintWingR)"/>
</g>
<g fill="none" stroke-linejoin="round">
  <path d="M55 53 15 80.5 M105 53 145 80.5" stroke="#dfe6e8" stroke-width=".7" opacity=".55"/>
  <path d="M24 86.8 55 84 M136 86.8 105 84 M40 85.5 38.5 76 M120 85.5 121.5 76 M50 84.6 49 69.5 M110 84.6 111 69.5" stroke="#2c353c" stroke-width=".55" opacity=".6"/>
  <path d="M24.6 87.4 55.4 84.6 M135.4 87.4 104.6 84.6" stroke="#c9d1d4" stroke-width=".4" opacity=".45"/>
  <path d="M30 76 44 67 M130 76 116 67 M44 101 55 95 M116 101 105 95" stroke="#2c353c" stroke-width=".45" opacity=".5"/>
</g>

<!-- Wingtip rails with short-range missiles -->
<g>
  <path d="M11.2 66h2.6v26h-2.6Z M146.2 66h2.6v26h-2.6Z" fill="url(#missile)"/>
  <path d="M11.2 66q1.3-4 2.6 0Z M146.2 66q1.3-4 2.6 0Z" fill="#3b4247"/>
  <path d="M9 88l2.2-2v6Z M16 88l-2.2-2v6Z M144 88l2.2-2v6Z M151 88l-2.2-2v6Z M9.6 71l1.6-1.4v3.4Z M15.4 71l-1.6-1.4v3.4Z M144.6 71l1.6-1.4v3.4Z M150.4 71l-1.6-1.4v3.4Z" fill="#6c7378"/>
  <path d="M11.2 74.5h2.6 M146.2 74.5h2.6" stroke="#c9a23a" stroke-width=".9"/>
</g>

<!-- Engine nacelles -->
<g filter="url(#bevel)">
  <path d="M57.4 47C56.5 62 56.5 90 57.4 106L58 113.5h14L72.6 106 73 46Z" fill="url(#nacelle)"/>
  <path d="M102.6 47C103.5 62 103.5 90 102.6 106L102 113.5H88L87.4 106 87 46Z" fill="url(#nacelle)"/>
</g>
<g>
  <path d="M57.4 104.5h15.2l-.9 9h-13.4Z M87.4 104.5h15.2l-.9 9h-13.4Z" fill="url(#petals)"/>
  <path d="M60.5 104.5v9 M63.5 104.5v9 M66.5 104.5v9 M69.5 104.5v9 M90.5 104.5v9 M93.5 104.5v9 M96.5 104.5v9 M99.5 104.5v9" stroke="#1d2024" stroke-width=".45" opacity=".7"/>
  <path d="M57.4 104.5h15.2 M87.4 104.5h15.2" stroke="#2a2723" stroke-width="1.1"/>
  <ellipse cx="65" cy="113.4" rx="6.4" ry="1.6" fill="url(#nozzle)"/>
  <ellipse cx="95" cy="113.4" rx="6.4" ry="1.6" fill="url(#nozzle)"/>
  <path d="M59 99h12 M89 99h12" stroke="#5b4a3f" stroke-width="3" opacity=".35"/>
</g>

<!-- Canted twin vertical stabilisers -->
<g filter="url(#bevel)">
  <path d="M67 75 60.2 91.5 58.2 102.6 66 101Z" fill="#7d8992"/>
  <path d="M93 75 99.8 91.5 101.8 102.6 94 101Z" fill="#5d6973"/>
</g>
<path d="M66.2 78 60.9 91.6 M93.8 78 99.1 91.6 M65.6 96.5 59.4 98 M94.4 96.5 100.6 98" stroke="#d3dadd" stroke-width=".45" opacity=".55"/>
<path d="M58.8 101.8 59.6 99.4 M101.2 101.8 100.4 99.4" stroke="#e4473f" stroke-width="1.1" filter="url(#glow)"/>

<!-- Intake ramps -->
<path d="M56.6 50.5 66 44.6 67.8 53 57.8 56.4Z M103.4 50.5 94 44.6 92.2 53 102.2 56.4Z" fill="#1a2025"/>
<path d="M57.3 51 66 45.6 M102.7 51 94 45.6" stroke="#b9c3c8" stroke-width=".7"/>
<path d="M58.4 55.2 67 52.4 M101.6 55.2 93 52.4" stroke="#39434a" stroke-width=".6"/>

<!-- Centre fuselage and spine -->
<path d="M80 3C76.5 9 73 20 71 33L66 46 73 56 74 98 77 106h6l3-8 1-42 7-10-5-13C87 20 83.5 9 80 3Z" fill="url(#fuselage)" filter="url(#bevel)"/>
<path d="M80 3C78.3 6 76.9 9.6 75.8 13.2 78.5 14.3 81.5 14.3 84.2 13.2 83.1 9.6 81.7 6 80 3Z" fill="url(#radome)"/>
<path d="M75.8 13.2Q80 14.8 84.2 13.2" stroke="#2c353c" stroke-width=".5" fill="none"/>
<g fill="none" stroke-linecap="round">
  <path d="M71 33 66 46 M89 33 94 46" stroke="#e7ecee" stroke-width=".6" opacity=".7"/>
  <path d="M76 44 76 98 M84 44 84 98 M74.5 60h11 M74.5 74h11 M74.8 88h10.4" stroke="#2c353c" stroke-width=".5" opacity=".55"/>
  <path d="M76.5 44.5 76.5 97.5" stroke="#dde3e5" stroke-width=".35" opacity=".5"/>
  <path d="M77.5 64h5v7h-5Z M78 80h4v5h-4Z" stroke="#2c353c" stroke-width=".45" opacity=".55"/>
</g>
<g fill="#23292e" opacity=".75">
  <circle cx="75.2" cy="50" r=".45"/><circle cx="84.8" cy="50" r=".45"/><circle cx="75.2" cy="67" r=".45"/><circle cx="84.8" cy="67" r=".45"/><circle cx="75.4" cy="84" r=".45"/><circle cx="84.6" cy="84" r=".45"/>
</g>

<!-- Gold-tinted bubble canopy with frame and cockpit shadows -->
<path d="M80 14.2C84.8 17.5 86.4 26.5 86 35 85.6 39.5 83 42.2 80 42.2S74.4 39.5 74 35C73.6 26.5 75.2 17.5 80 14.2Z" fill="#1a1f23"/>
<path d="M80 15C84.3 18 85.6 26.5 85.3 34.6 85 38.8 82.7 41.3 80 41.3S75 38.8 74.7 34.6C74.4 26.5 75.7 18 80 15Z" fill="url(#canopy)"/>
<path d="M75.3 30.3Q80 28.4 84.7 30.3" stroke="#262a2c" stroke-width="1.1" fill="none"/>
<path d="M76.7 22.5C77.6 19.6 78.6 17.9 80 16.9 79.2 19.8 78.6 23.3 78.3 27.2 77.4 26.3 76.8 24.8 76.7 22.5Z" fill="#fffbe6" opacity=".78"/>
<path d="M81.9 33.2C83 34.2 83.5 36.3 83 38.3" stroke="#fff5d6" stroke-width=".7" fill="none" opacity=".55"/>

<!-- Markings and lights -->
<g opacity=".82">
  <circle cx="33" cy="80" r="3.1" fill="#56626b"/><circle cx="33" cy="80" r="1.9" fill="#8a959c"/><circle cx="33" cy="80" r=".8" fill="#56626b"/>
  <circle cx="127" cy="80" r="3.1" fill="#4c5861"/><circle cx="127" cy="80" r="1.9" fill="#7c878f"/><circle cx="127" cy="80" r=".8" fill="#4c5861"/>
</g>
<path d="M44.4 77.5h2.6l-1 2.8h-2.6Z M113 77.5h2.6l1 2.8h-2.6Z" fill="#c8513e" opacity=".85"/>
<text x="80" y="95.5" font-family="Arial Narrow,Arial,sans-serif" font-size="4.2" font-weight="700" text-anchor="middle" fill="#3b464e" opacity=".8">07</text>
<g filter="url(#glow)">
  <circle cx="13.4" cy="84" r="1" fill="#ff5a4a"/>
  <circle cx="146.6" cy="84" r="1" fill="#6dffa0"/>
  <circle cx="80" cy="47.5" r=".65" fill="#ffe2a0"/>
</g>

<use href="#airframe" xlink:href="#airframe" filter="url(#grime)" opacity=".55"/>
</svg>
