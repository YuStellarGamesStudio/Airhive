<circle cx="60" cy="56" r="9" fill="#303637" stroke="#92958b" stroke-width="1.4"/><circle cx="60" cy="56" r="6.4" fill="#161921"/><circle cx="60" cy="56" r="4.8" fill="url(#lens)"/><path d="M57 53q2-2 4-1" fill="none" stroke="#f3d9eb" stroke-width=".8"/><path d="M53 57 49 60v5l5-3 M67 57l4 3v5l-5-3 M58 48l2-5 2 5" fill="#34333e" stroke="#afa5a5" stroke-width=".6"/><circle cx="60" cy="56" r="2.2" fill="#ac70be" opacity=".75" filter="url(#glow)"/>
