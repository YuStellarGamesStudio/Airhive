<path d="M52 13h16l-2 11H54Z" fill="#4d5551" filter="url(#bevel)"/><ellipse cx="60" cy="12" rx="6.5" ry="2.5" fill="url(#nozzle)"/><path d="M55 15v-4 M58 15v-5 M62 15v-5 M65 15v-4" stroke="#202324" stroke-width=".6"/>
<path d="M60 95C54 87 50 69 48 55l2-21 4-19h12l4 19 2 21c-2 14-6 32-12 40Z" fill="url(#body)" filter="url(#bevel)"/>
<path d="M53 27h14l2 13-18 2Z" fill="#202a2b"/><path d="M54 28h12l1 10-14 2Z" fill="#65716d"/><path d="M54 29 61 28l-6 8Z" fill="#d1c8be" opacity=".67"/>
