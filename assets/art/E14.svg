<g fill="none" stroke="#1e2928" stroke-width=".8" opacity=".75"><path d="M14 39q9 3 10 11 M33 24q9 7 8 13 M79 24q-6 7-6 13 M105 35q-9 4-9 14 M14 61q11-5 13-10 M34 74q8-7 8-12 M82 75q-7-7-8-12 M108 59q-12-3-14-10"/></g>
<!-- Tensioned radial spars, radial impeller vanes and exposed central machinery. -->
<g filter="url(#bevel)" fill="#515c58"><path d="M22 34 51 41l-1 8-32-8Z M98 34 69 41l1 8 32-8Z M22 60l28-12 5 8-25 16Z M98 60 70 48l-5 8 25 16Z"/></g>
