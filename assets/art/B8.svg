<path d="M102 11h36l22 28 3 36-20 33-8 21-15 9-15-9-8-21-20-33 3-36Z" fill="url(#body)" filter="url(#bevel)"/>
<path d="M102 15h36l17 25-11 10h-48L85 40Z" fill="#39333c" stroke="#bdb0b1" stroke-width=".8"/>
