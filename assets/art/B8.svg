<path d="M97 24h46M84 51l-3 19m75-19 3 19" fill="none" stroke="#c5bdb8" stroke-width=".7" opacity=".55"/>
<path d="M96 49 104 43h32l8 6 6 25-11 24-19 13-19-13-11-24Z" fill="#27232d" stroke="#aaa5a3" stroke-width="1.5"/>
