<path d="M102 74h-9m45 0h9m-27-24v-8m0 48v10" stroke="#e7a4cc" stroke-width="1.8"/>
<path d="M93 80 109 100l-2 23 13 15 13-15-2-23 16-20-12 9-15 15-15-15Z" fill="url(#steel)" stroke="#24232f" stroke-width="1"/>
<path d="M110 106 120 115l10-9-4 19-6 10-6-10Z" fill="#25222e" stroke="#9a8d96" stroke-width=".8"/>
<path d="M117 111h6l-3 16Z" fill="#e368af" filter="url(#glow)" opacity=".85"/>
<path d="M114 67h5v7h-5Z" fill="#ffe0f1" opacity=".6"/>
