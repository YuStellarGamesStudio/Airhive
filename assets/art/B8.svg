<ellipse cx="174" cy="72" rx="8" ry="6" fill="#1a1b22" stroke="#8c8e96" stroke-width="1"/>
<ellipse cx="174" cy="72" rx="3.2" ry="3.5" fill="url(#reactor)"/>
