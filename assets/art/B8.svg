<path d="M48 38 58 41 54 48 44 45Z M192 38l-10 3 4 7 10-3Z" fill="#8f2a22"/>
<!-- Rear triple-drive manifold and heat-stained exhausts. -->
<g filter="url(#bevel)"><path d="M84 27 88 12h18l7 24-6 15-17 4-13-13Z M156 27l-4-15h-18l-7 24 6 15 17 4 13-13Z" fill="url(#steel)"/></g>
<ellipse cx="97" cy="13" rx="7" ry="3.5" fill="url(#nozzle)"/><ellipse cx="143" cy="13" rx="7" ry="3.5" fill="url(#nozzle)"/>
<path d="M92 13v11m3-12v12m5-12v12m3-11v11m34-11v11m3-12v12m5-12v12m3-11v11" stroke="#24232a" stroke-width="1"/>
<path d="M82 37 108 32m50 5-26-5M83 42l24-5m50 5-24-5" fill="none" stroke="#b9b2ad" stroke-width=".7" opacity=".6"/>
