<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="100" viewBox="0 0 120 100">
<defs>
  <filter id="hull" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.4" diffuseConstant="1.22" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="54"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".95" specularExponent="30" lighting-color="#f4f9ff" result="specular"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".5" specularExponent="14" lighting-color="#7fc4ff" result="rim"><feDistantLight azimuth="30" elevation="24"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="rim" operator="arithmetic" k2="1" k3=".55" result="gloss0"/>
    <feComposite in="gloss0" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".42" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".07 .12" numOctaves="3" seed="35" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="22" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".75" k3=".25"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .06  0 0 0 0 .05  0 0 0 0 .05  -1.7 0 0 0 1.02"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
    <feOffset dx="2.5" dy="4.5" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.3" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#889289"/><stop offset=".5" stop-color="#5d6963"/><stop offset="1" stop-color="#262e30"/></linearGradient>
  <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52635e"/><stop offset=".48" stop-color="#394c48"/><stop offset="1" stop-color="#222a2c"/></linearGradient>
  <linearGradient id="carapace" x1="0" x2="1"><stop stop-color="#202927"/><stop offset=".3" stop-color="#879486"/><stop offset=".48" stop-color="#52675e"/><stop offset="1" stop-color="#1d2928"/></linearGradient>
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a5c"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#3fd0d8"/></linearGradient>
  <radialGradient id="optic" cx=".36" cy=".32"><stop stop-color="#f1ffcb"/><stop offset=".24" stop-color="#b6ed80"/><stop offset=".65" stop-color="#3c8c50"/><stop offset="1" stop-color="#0d2621"/></radialGradient>
  <g id="airframe"><path d="M46 96 43 91 46 75 37 68 7 77 5 67 35 54 44 54 45 45 6 44 8 34 41 26 50 33 53 13 67 13 70 33 79 26 112 34 114 44 75 45 76 54 85 54 115 67 113 77 83 68 74 75 77 91 74 96 65 84 60 92 55 84Z"/></g>
</defs>
<use href="#airframe" xlink:href="#airframe" filter="url(#shadow)"/>
<!-- Four separately articulated aerofoil limbs with inset hinge knuckles. -->
<g filter="url(#hull)">
  <path d="M51 34 41 26 8 34 6 44 43 45 54 47Z" fill="url(#wingL)"/>
  <path d="M69 34 79 26 112 34 114 44 77 45 66 47Z" fill="url(#wingR)"/>
  <path d="M50 52 35 54 5 67 7 77 37 68 53 66Z" fill="url(#wingL)"/>
  <path d="M70 52 85 54 115 67 113 77 83 68 67 66Z" fill="url(#wingR)"/>
  <path d="M53 14h14l8 24-2 27-8 20-5 6-5-6-8-20-2-27Z" fill="url(#carapace)"/>
</g>
<path d="M49 34 9 35 8 40 46 40Z M71 34l40 1 1 5-38-0Z M47 58 7 68 9 72 44 63Z M73 58l40 10-2 4-35-9Z" fill="url(#film)" opacity=".11"/>
<path d="M8 34 41 26 51 33 50 36 40 29 7 38Z M112 34l-33-8-10 7 1 3 10-7 33 9Z" fill="#212b2b"/>
<path d="M5 67 35 54 45 54 45 57 36 57 6 72Z M115 67 85 54 75 54 75 57 84 57 114 72Z" fill="#202a29"/>
<path d="M9 35 41 28 48 35 M111 35 79 28 72 35 M7 69 36 56 M113 69 84 56" stroke="#d1d5bb" stroke-width=".6" opacity=".65" fill="none"/>
<path d="M9 43 42 43 M111 43 78 43 M8 76 36 66 M112 76 84 66 M24 31 26 43 M96 31l-2 12 M19 64l6 7 M101 64l-6 7" stroke="#1b2c29" stroke-width=".9" fill="none"/>
<path d="M19 35 27 33 30 36 20 38Z M101 35 93 33 90 36 100 38Z M18 67 27 63 30 66 20 71Z M102 67l-9-4-3 3 10 5Z" fill="#4b7451" opacity=".8"/>
<path d="M19 35 27 33 M101 35l-8-2 M18 67l9-4 M102 67l-9-4" stroke="#c8eb9b" stroke-width=".6" opacity=".65"/>
<circle cx="45" cy="43" r="3.6" fill="#1a2524"/><circle cx="75" cy="43" r="3.6" fill="#1a2524"/>
<circle cx="44" cy="58" r="3.3" fill="#1a2524"/><circle cx="76" cy="58" r="3.3" fill="#1a2524"/>
<path d="M44 39v7 M76 39v7 M43 55v6 M77 55v6" stroke="#939e8d" stroke-width=".55"/>
<!-- Ribbed, replaceable thorax armor over a narrow exposed abdomen. -->
<path d="M52 15 60 12 68 15 72 35 68 44 52 44 48 35Z" fill="url(#carapace)"/>
<path d="M49 39 55 43h10l6-4 2 9-8 5H55l-8-5Z M47 52l8 4h10l8-4-2 9-8 5h-6l-8-5Z M51 65l7 3h4l7-3-4 13-5 8-5-8Z" fill="url(#carapace)"/>
<path d="M48 39 55 45h10l7-6 M47 52l8 6h10l8-6 M51 65l7 5h4l7-5 M55 77l5 8 5-8" fill="none" stroke="#192b28" stroke-width="1.3"/>
<path d="M50 37 55 42 M48 50l7 5 M51 63l7 4" stroke="#c0d0ac" stroke-width=".65" opacity=".7"/>
<path d="M57 19 60 17 63 19 65 30 60 35 55 30Z" fill="#102520"/>
<path d="M57 20 60 18 63 20 64 29 60 33 56 29Z" fill="url(#optic)"/>
<path d="M58 21 59.5 19.5 M56 30l4 3" stroke="#f1ffe1" stroke-width=".7"/>
<path d="M53 13V8h5v6 M62 14V8h5v5" fill="#343f39"/>
<path d="M53 8h5 M62 8h5" stroke="#ff7a45" stroke-width="1.55" filter="url(#glow)"/>
<path d="M54 8h3 M63 8h3" stroke="#fff3df" stroke-width=".5"/>
<!-- Split tactile mandibles: blades remain separate at the forward end. -->
<path d="M55 73 58 80 54 86 46 96 43 91 47 75Z M65 73 62 80 66 86 74 96 77 91 73 75Z" fill="url(#carapace)" filter="url(#hull)"/>
<path d="M46 91 54 83 M74 91l-8-8" stroke="#c2d6b6" stroke-width=".7"/>
<path d="M55 80 58 78 60 81 62 78 65 80 60 87Z" fill="#122521"/>
<circle cx="60" cy="82" r="1.9" fill="url(#optic)" filter="url(#glow)"/>
<path d="M28 37 31 35 34 37v3l-3 2-3-2Z M86 37l3-2 3 2v3l-3 2-3-2Z" fill="#422620"/>
<path d="M31 37 33 40h-4Z M89 37l2 3h-4Z" fill="#c76849"/>
<path d="M10 42h3 M107 42h3 M11 74h3 M106 74h3" stroke="#a9eb7d" stroke-width="1" filter="url(#glow)"/>
<use href="#airframe" xlink:href="#airframe" filter="url(#wear)" opacity=".3"/>
</svg>
