<path d="M106 113 120 131 134 113l-4 17-10 6-10-6Z" fill="#3a4847" stroke="#a1aaa0" stroke-width=".6"/>
<path d="M94 52 103 42h34l9 10-3 32-12 14h-22L97 84Z" fill="#273537" stroke="#899b95" stroke-width="1.2"/>
<path d="M100 54 107 47h26l7 7-3 27-9 11h-16l-9-11Z" fill="#768781" stroke="#c2cac1" stroke-width="1"/>
<path d="M104 58 110 52h20l6 6-4 22-8 8h-8l-8-8Z" fill="#1b3037" stroke="#131d23" stroke-width="3"/>
<path d="M109 57 114 54h12l5 3-3 22-7 6h-2l-7-6Z" fill="#15232b" stroke="#5c8e92" stroke-width=".8"/>
<ellipse cx="120" cy="70" rx="10" ry="13" fill="url(#core)"/>
<path d="M112 62q3-6 9-6" stroke="#e4ffff" stroke-width="1.4" opacity=".85" fill="none"/>
<path d="M101 68h9m20 0h9M120 51v7m0 25v8" stroke="#b2e4df" stroke-width="1.7"/>
<path d="M104 60 110 53m26 7-6-7m-26 29 8 8m24-8-8 8" fill="none" stroke="#3b5255" stroke-width="2"/>
