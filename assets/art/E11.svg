<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="100" viewBox="0 0 120 100">
<defs>
  <filter id="hull" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="2.4" diffuseConstant="1.22" lighting-color="#fff" result="diffuse"><feDistantLight azimuth="225" elevation="54"/></feDiffuseLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".95" specularExponent="30" lighting-color="#f4f9ff" result="specular"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>
    <feSpecularLighting in="height" surfaceScale="2.4" specularConstant=".5" specularExponent="14" lighting-color="#7fc4ff" result="rim"><feDistantLight azimuth="30" elevation="24"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="diffuse" operator="arithmetic" k1="1" result="lit"/>
    <feComposite in="specular" in2="rim" operator="arithmetic" k2="1" k3=".55" result="gloss0"/>
    <feComposite in="gloss0" in2="SourceAlpha" operator="in" result="gloss"/>
    <feComposite in="gloss" in2="lit" operator="arithmetic" k2=".42" k3="1" result="shaded"/>
    <feComposite in="shaded" in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="wear" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".07 .12" numOctaves="3" seed="53" result="mottle"/>
    <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="21" result="grain"/>
    <feComposite in="mottle" in2="grain" operator="arithmetic" k2=".75" k3=".25"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .06  0 0 0 0 .05  0 0 0 0 .05  -1.7 0 0 0 1.02"/>
    <feComposite in2="SourceAlpha" operator="in"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
    <feOffset dx="2.5" dy="4.5" result="blur"/>
    <feFlood flood-color="#01050b" flood-opacity=".5"/>
    <feComposite in2="blur" operator="in"/>
  </filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="1.3" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a8afb1"/><stop offset=".48" stop-color="#747f84"/><stop offset="1" stop-color="#404d52"/></linearGradient>
  <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78848a"/><stop offset=".48" stop-color="#55646b"/><stop offset="1" stop-color="#303d46"/></linearGradient>
  <linearGradient id="body" x1="0" x2="1"><stop stop-color="#303a41"/><stop offset=".3" stop-color="#bec6c2"/><stop offset=".48" stop-color="#8f9c9c"/><stop offset="1" stop-color="#303d44"/></linearGradient>
  <linearGradient id="armour" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#aab6b7"/><stop offset=".38" stop-color="#737f84"/><stop offset="1" stop-color="#313e46"/></linearGradient>
  <radialGradient id="lens" cx=".33" cy=".3" r=".72"><stop stop-color="#e9ffff"/><stop offset=".22" stop-color="#9beff7"/><stop offset=".55" stop-color="#4bb2c6"/><stop offset=".85" stop-color="#246275"/><stop offset="1" stop-color="#132c3c"/></radialGradient>
  <linearGradient id="film" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a5c"/><stop offset=".5" stop-color="#9b6bff"/><stop offset="1" stop-color="#3fd0d8"/></linearGradient>
  <g id="airframe"><path d="M60 96 49 84 41 80 36 91 17 90 12 81 10 71 5 66 7 38 16 31 40 35 49 22 53 17 53 4.5H67V17L71 22 80 35 104 31 113 38 115 66 110 71 108 81 103 90 84 91 79 80 71 84Z"/></g>
</defs>
<use href="#airframe" xlink:href="#airframe" filter="url(#shadow)"/>
<!-- Broad chamfered shoulders protect the field hardware from direct fire. -->
<g filter="url(#hull)"><path d="M50 35 16 31 7 38 5 66 17 78 41 80 55 55Z" fill="url(#wingL)"/><path d="M70 35 104 31 113 38 115 66 103 78 79 80 65 55Z" fill="url(#wingR)"/><path d="M19 36 37 40 44 65 37 91 17 90 12 81 14 65Z M101 36 83 40 76 65 83 91 103 90 108 81 106 65Z" fill="url(#armour)"/></g>
<path d="M8 39 17 34 43 40 43 45 16 41 8 47Z M112 39 103 34 77 40 77 45 104 41 112 47Z" fill="#202b33"/>
<path d="M7 38 17 32 40 36 M113 38l-10-6-23 4 M10 65l8 10 20 2 M110 65l-8 10-20 2" fill="none" stroke="#d4e0e0" stroke-width=".65" opacity=".65"/>
<path d="M25 38 40 42 42 73 35 86 18 84 15 67 19 43Z M95 38 80 42 78 73 85 86 102 84 105 67 101 43Z" fill="#3a4950"/>
<path d="M20 46 34 48 38 66 32 78 19 76 17 64Z M100 46 86 48 82 66 88 78 101 76 103 64Z" fill="url(#armour)"/>
<path d="M20 46 34 48 M100 46 86 48 M19 76 32 78 M101 76 88 78 M24 49 26 59 M96 49 94 59" fill="none" stroke="#dce6e5" stroke-width=".65" opacity=".7"/>
<path d="M19 45 34 48 36 65 30 77 19 76Z M101 45 86 48 84 65 90 77 101 76Z" fill="url(#film)" opacity=".1"/>
<!-- Two independent shield emitters are recessed into armored bezels. -->
<path d="M16 60 30 61 34 70 29 80 18 81 12 70Z M104 60 90 61 86 70 91 80 102 81 108 70Z" fill="#131e28" stroke="#a1b4b5" stroke-width=".7"/>
<path d="M19 63 28 64 30 70 27 77 20 78 16 70Z M101 63 92 64 90 70 93 77 100 78 104 70Z" fill="url(#lens)"/>
<path d="M19 64h7 M101 64h-7" stroke="#f3ffff" stroke-width=".8"/>
<path d="M18 70h5 M102 70h-5" stroke="#9defff" stroke-width="1.1" filter="url(#glow)"/>
<path d="M14 81 18 87h10 M106 81l-4 6H92" stroke="#b9c9ca" stroke-width=".8" fill="none"/>
<!-- Two recessed thrust outlets and a vented reactor spine. -->
<path d="M53 9h14l2 19H51Z" fill="#38444a" filter="url(#hull)"/>
<path d="M54 8h12v3H54Z" fill="#18232b"/>
<rect x="54.5" y="4.5" width="11" height="2.2" rx="1.1" fill="#ff7a45" filter="url(#glow)"/>
<path d="M57 5.5h6" stroke="#fff0e0" stroke-width=".55"/>
<path d="M55 15v12 M58 15v12 M62 15v12 M65 15v12" stroke="#87989c" stroke-width=".6"/>
<g filter="url(#hull)"><path d="M60 96 48 84 46 61 46 40 51 25H60Z" fill="url(#body)"/><path d="M60 96 72 84 74 61 74 40 69 25H60Z" fill="#596a70"/></g>
<path d="M60 96 48 84 46 61 46 40 51 25H69L74 40 74 61 72 84Z" fill="url(#film)" opacity=".08"/>
<path d="M52 31h16l-2 12H54Z" fill="#202f36"/><path d="M53 31h14 M54 40h12" stroke="#cad7d6" stroke-width=".7"/>
<path d="M48 47 60 50 72 47 72 58 60 64 48 58Z" fill="#8b9999" stroke="#27353c" stroke-width=".9"/>
<path d="M50 48 60 51 70 48 M49 57l11 5 11-5" stroke="#d4ded9" stroke-width=".6" fill="none"/>
<path d="M60 64 50 67 53 80 60 94 67 80 70 67Z" fill="url(#armour)"/>
<path d="M51 69 60 72 69 69 M54 78 60 81 66 78 M55 84 60 94 65 84" fill="none" stroke="#222e36" stroke-width=".85"/>
<path d="M55 74h10v7H55Z" fill="#182630" stroke="#93a5a7" stroke-width=".6"/>
<path d="M57 75h6v5h-6Z" fill="url(#lens)"/>
<path d="M58 76h4" stroke="#e4ffff" stroke-width=".7"/>
<path d="M37 47h6v3h-6Z M83 47h-6v3h6Z" fill="#6c2525"/>
<path d="M38 48 40 47 42 48v1l-2 1-2-1Z M78 48l2-1 2 1v1l-2 1-2-1Z" fill="#c84942"/>
<use href="#airframe" xlink:href="#airframe" filter="url(#wear)" opacity=".3"/>
</svg>
