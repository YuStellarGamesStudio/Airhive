<path d="M8 45 16 46v5H8Z M112 45l-8 1v5h8Z" fill="#692a2b"/>
<path d="M10 47h4 M110 47h-4" stroke="#e7786b" stroke-width=".7"/>
<!-- Four recessed ion drive cassettes, each with a hot throat and physical vanes. -->
<g filter="url(#hull)">
  <path d="M15 28 18 22h10l3 6v17H15Z M34 30l3-10h10l3 10v20H34Z M86 30l-3-10H73l-3 10v20h16Z M105 28l-3-6H92l-3 6v17h16Z" fill="url(#bomb)"/>
</g>
<path d="M16 24h13v5H16Z M35 22h14v5H35Z M71 22h14v5H71Z M91 24h13v5H91Z" fill="#11171c"/>
<path d="M17 25h11 M36 23h12 M72 23h12 M92 25h11" stroke="#ff7a45" stroke-width="2" filter="url(#glow)"/>
<path d="M19 24.8h7 M38 22.8h8 M74 22.8h8 M94 24.8h7" stroke="#fff1d9" stroke-width=".65"/>
<path d="M19 29v4 M23 29v4 M27 29v4 M38 27v4 M42 27v4 M46 27v4 M74 27v4 M78 27v4 M82 27v4 M93 29v4 M97 29v4 M101 29v4" stroke="#1a1b20" stroke-width=".55"/>
<path d="M16 36h13 M35 39h14 M71 39h14 M91 36h13" stroke="#c5c1bb" stroke-width=".6" opacity=".65"/>
<!-- Armored center section, bomb bay open below the dorsal command blister. -->
<path d="M56 12 60 9 64 12 69 36 66 48 54 48 51 36Z" fill="url(#body)"/>
<path d="M56 24 60 16 64 24 63 35 60 38 57 35Z" fill="#131a22"/>
<path d="M57 25 60 18 63 25 62 34 60 36 58 34Z" fill="#695b61"/>
