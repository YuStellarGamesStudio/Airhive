<path d="M52 47h16l3 31-11 15-11-15Z" fill="#11151b"/>
<path d="M50 50 54 53 54 79 49 74Z M70 50 66 53 66 79 71 74Z" fill="url(#body)"/>
<path d="M50 51 54 54 M70 51l-4 3 M49 73l5 6 M71 73l-5 6" stroke="#d2bec1" stroke-width=".55"/>
<path d="M55 55h10v28H55Z" fill="#1a1f27"/>
<path d="M56 56v26 M60 56v26 M64 56v26" stroke="#49515d" stroke-width=".55"/>
<path d="M56.5 59h2.5v16l-1.25 5-1.25-5Z M61 59h2.5v16l-1.25 5L61 75Z" fill="url(#bomb)"/>
<path d="M56.7 65h2.1 M61.2 65h2.1" stroke="#dd5048" stroke-width="2"/>
<path d="M57.75 78v3 M62.25 78v3" stroke="#ada6a3" stroke-width=".5"/>
<path d="M20 52 24 50 28 52v4l-4 2-4-2Z M92 52l4-2 4 2v4l-4 2-4-2Z" fill="#571e23"/>
<path d="M24 52 27 56h-6Z M96 52l3 4h-6Z" fill="#f46c64"/>
<path d="M10 63h3 M107 63h3 M50 80l4 5 M70 80l-4 5" stroke="#f47167" stroke-width="1" filter="url(#glow)"/>
<use href="#airframe" xlink:href="#airframe" filter="url(#wear)" opacity=".3"/>
</svg>
